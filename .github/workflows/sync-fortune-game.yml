name: Sync Fortune Game

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"
    - cron: "5 15 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Write runtime secrets
        shell: bash
        run: |
          mkdir -p .auth
          cat > .env <<'EOF'
          FORTUNE_PARTNERS_URL=${{ secrets.FORTUNE_PARTNERS_URL }}
          FORTUNE_SHEET_ID=${{ secrets.FORTUNE_SHEET_ID }}
          FORTUNE_SCHOOL_ID=${{ secrets.FORTUNE_SCHOOL_ID }}
          FORTUNE_API_BASE_URL=${{ secrets.FORTUNE_API_BASE_URL }}
          FORTUNE_TIMEZONE=${{ secrets.FORTUNE_TIMEZONE }}
          FORTUNE_SCORE_RESET_HOUR=${{ secrets.FORTUNE_SCORE_RESET_HOUR }}
          FORTUNE_WEEK_START=${{ secrets.FORTUNE_WEEK_START }}
          FORTUNE_LOG_LIMIT=${{ secrets.FORTUNE_LOG_LIMIT }}
          FORTUNE_LOOKBACK_DAYS=${{ secrets.FORTUNE_LOOKBACK_DAYS }}
          FORTUNE_WEB_APP_URL=${{ secrets.FORTUNE_WEB_APP_URL }}
          GOOGLE_CREDENTIALS_PATH=./credentials.json
          EOF
          printf '%s' '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

          if [[ -n '${{ secrets.TEAMS_CONFIG_JSON }}' ]]; then
            printf '%s' '${{ secrets.TEAMS_CONFIG_JSON }}' > teams.local.json
          fi

          if [[ -n '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON }}' ]]; then
            printf '%s' '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON }}' > .auth/storage-state.json
          fi

          if [[ -n '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM7 }}' ]]; then
            printf '%s' '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM7 }}' > .auth/team7-storage-state.json
          elif [[ -n '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON }}' ]]; then
            printf '%s' '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON }}' > .auth/team7-storage-state.json
          fi

          if [[ -n '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM2 }}' ]]; then
            printf '%s' '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM2 }}' > .auth/team2-storage-state.json
          fi

          if [[ -n '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM3 }}' ]]; then
            printf '%s' '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM3 }}' > .auth/team3-storage-state.json
          fi

          if [[ -n '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM4 }}' ]]; then
            printf '%s' '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM4 }}' > .auth/team4-storage-state.json
          fi

          if [[ -n '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM5 }}' ]]; then
            printf '%s' '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM5 }}' > .auth/team5-storage-state.json
          fi

          if [[ -n '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM9 }}' ]]; then
            printf '%s' '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_TEAM9 }}' > .auth/team9-storage-state.json
          fi

          if [[ -n '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_BRIGADE1 }}' ]]; then
            printf '%s' '${{ secrets.PLAYWRIGHT_STORAGE_STATE_JSON_BRIGADE1 }}' > .auth/brigade1-storage-state.json
          fi

      - name: Validate team storage states
        shell: bash
        run: |
          echo "teams.json references:"
          cat teams.json
          echo ""
          echo "Checking expected storage-state files..."

          if [[ -f .auth/team7-storage-state.json ]]; then
            echo "team7 storage state: OK"
          else
            echo "::error::Missing .auth/team7-storage-state.json. Add PLAYWRIGHT_STORAGE_STATE_JSON_TEAM7 or fallback PLAYWRIGHT_STORAGE_STATE_JSON."
            exit 1
          fi

          if grep -q '"team_key"[[:space:]]*:[[:space:]]*"team2"' teams.json; then
            if [[ -f .auth/team2-storage-state.json ]]; then
              echo "team2 storage state: OK"
            else
              echo "::error::Missing .auth/team2-storage-state.json. Check GitHub secret PLAYWRIGHT_STORAGE_STATE_JSON_TEAM2 and make sure it is saved under Repository secrets."
              exit 1
            fi
          fi

          if grep -q '"team_key"[[:space:]]*:[[:space:]]*"team3"' teams.json; then
            if [[ -f .auth/team3-storage-state.json ]]; then
              echo "team3 storage state: OK"
            else
              echo "::error::Missing .auth/team3-storage-state.json. Check GitHub secret PLAYWRIGHT_STORAGE_STATE_JSON_TEAM3 and make sure it is saved under Repository secrets."
              exit 1
            fi
          fi

          if grep -q '"team_key"[[:space:]]*:[[:space:]]*"team4"' teams.json; then
            if [[ -f .auth/team4-storage-state.json ]]; then
              echo "team4 storage state: OK"
            else
              echo "::error::Missing .auth/team4-storage-state.json. Check GitHub secret PLAYWRIGHT_STORAGE_STATE_JSON_TEAM4 and make sure it is saved under Repository secrets."
              exit 1
            fi
          fi

          if grep -q '"team_key"[[:space:]]*:[[:space:]]*"team5"' teams.json; then
            if [[ -f .auth/team5-storage-state.json ]]; then
              echo "team5 storage state: OK"
            else
              echo "::error::Missing .auth/team5-storage-state.json. Check GitHub secret PLAYWRIGHT_STORAGE_STATE_JSON_TEAM5 and make sure it is saved under Repository secrets."
              exit 1
            fi
          fi

          if grep -q '"team_key"[[:space:]]*:[[:space:]]*"team9"' teams.json; then
            if [[ -f .auth/team9-storage-state.json ]]; then
              echo "team9 storage state: OK"
            else
              echo "::error::Missing .auth/team9-storage-state.json. Check GitHub secret PLAYWRIGHT_STORAGE_STATE_JSON_TEAM9 and make sure it is saved under Repository secrets."
              exit 1
            fi
          fi

          if grep -q '"team_key"[[:space:]]*:[[:space:]]*"brigade1"' teams.json; then
            if [[ -f .auth/brigade1-storage-state.json ]]; then
              echo "brigade1 storage state: OK"
            else
              echo "::error::Missing .auth/brigade1-storage-state.json. Check GitHub secret PLAYWRIGHT_STORAGE_STATE_JSON_BRIGADE1 and make sure it is saved under Repository secrets."
              exit 1
            fi
          fi

          echo "Available auth files:"
          ls -la .auth

      - name: Run sync
        run: python run.py sync
